<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b110b" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b110b" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b110b" />
  <title>Moonshard: The High Forest | G$ on Celo</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/ui/theme.css" />
</head>
<body>
  <div id="app">
    <!-- Retro Arcade Header -->
    <header id="arcade-header">
      <div class="header-brand">
        <span class="tree-icon">🌲</span>
        <span class="game-title">MOONSHARD</span>
      </div>
      
      <div class="header-status">
        <!-- In-Battle Timer (Header / Portrait) -->
        <div id="header-timer-badge" class="header-timer-badge hidden" title="Battle Elapsed Time">
          <span id="header-timer-text">TIME: 0s</span>
        </div>

        <!-- Pause Button (Header / Portrait) -->
        <button id="btn-pause-header" class="pixel-wallet-btn pause-header-btn hidden" title="Pause Game" aria-label="Pause">
          <span class="pause-icon">⏸</span>
        </button>

        <!-- G$ Wallet Status Button -->
        <button id="btn-wallet" class="pixel-wallet-btn" title="G$ Wallet">
          <span class="wallet-bolt">⚡</span>
          <span id="wallet-btn-text">G$</span>
          <span id="wallet-dot" class="wallet-dot offline"></span>
        </button>
      </div>
    </header>

    <!-- Floating Landscape Header Bar (Timer, Pause, and Wallet Status) -->
    <div id="landscape-top-bar" class="landscape-top-bar">
      <div id="landscape-pause-group" class="landscape-pause-group hidden">
        <div id="landscape-timer-badge" class="landscape-timer-badge" title="Battle Elapsed Time">
          <span id="landscape-timer-text">TIME: 0s</span>
        </div>
        <button id="btn-pause-landscape" class="landscape-pause-btn" title="Pause Game" aria-label="Pause">
          <span class="pause-icon">⏸</span>
        </button>
      </div>

      <button id="btn-wallet-landscape" class="landscape-wallet-btn" title="G$ Wallet" aria-label="G$ Wallet">
        <span class="wallet-bolt">⚡</span>
        <span id="wallet-btn-text-landscape">G$</span>
        <span id="wallet-dot-landscape" class="wallet-dot offline"></span>
      </button>
    </div>

    <!-- Main Game Canvas Container -->
    <main id="game-wrapper">
      <div id="game-container">
        <div id="crt-overlay" class="crt-overlay"></div>
      </div>
      
      <!-- Virtual Touch Controls for Mobile Viewport -->
      <div id="touch-controls" class="touch-controls hidden">
        <div class="touch-dpad horizontal-only">
          <button id="touch-left" class="touch-btn dpad-btn" data-key="left" aria-label="Left">◀</button>
          <button id="touch-right" class="touch-btn dpad-btn" data-key="right" aria-label="Right">▶</button>
        </div>

        <div class="touch-actions">
          <button id="touch-jump" class="touch-btn action-btn jump" data-key="jump" aria-label="Jump">
            <span>JUMP</span>
          </button>
          <button id="touch-attack" class="touch-btn action-btn attack" data-key="attack" aria-label="Slash">
            <span>SLASH</span>
          </button>
          <button id="touch-upslash" class="touch-btn action-btn upslash" data-key="upslash" aria-label="Up Attack">
            <span>UP<br>ATTK</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- The interface: menus and sheets drawn over the whole screen (see src/ui). Everything in it is styled under #ms-ui. -->
  <div id="ms-ui">
    <div class="ms-stage">

  <script>
    // The loading screen's behaviour. It runs before anything else is downloaded: the moon fills in as the game loads,
    // creeping a little at first so the page looks alive, then following the game's real progress (BootScene).
    (function () {
      var root = document.getElementById('ms-loader');
      if (!root) return;
      var rects = Array.prototype.map.call(root.querySelectorAll('#ldMoon rect'), function (r) { return { r: r, k: +r.getAttribute('data-r') }; });
      var shards = Array.prototype.slice.call(root.querySelectorAll('.ld-shard'));
      var fill = document.getElementById('ldFill');
      var pct = document.getElementById('ldPct');
      var moon = document.getElementById('ldMoon');
      var from = shards.map(function (_, i) { var a = (-90 + i * 72 + 18) * Math.PI / 180; return [Math.cos(a) * 150, Math.sin(a) * 74]; });
      var clamp = function (v) { return Math.max(0, Math.min(1, v)); };
      var target = 0.06, shown = 0, start = Date.now(), closing = false, finished = false;
      function paint(e) {
        if (fill) fill.style.width = (e * 100) + '%';
        if (pct) pct.textContent = Math.round(e * 100) + '%';
        for (var i = 0; i < rects.length; i++) rects[i].r.style.opacity = rects[i].k <= e ? 1 : 0;
        shards.forEach(function (s, i) {
          var l = clamp((e * 1.3 - i * 0.13) / 0.5), q = 1 - Math.pow(1 - l, 3);
          s.style.transform = 'translate(' + (from[i][0] * (1 - q)) + 'px,' + (from[i][1] * (1 - q)) + 'px) scale(' + (1 - 0.4 * q) + ')';
          s.style.opacity = l >= 1 ? 0 : 1;
        });
      }
      function tick() {
        if (!root.parentNode) return;
        if (!closing) target = Math.max(target, Math.min(0.3, (Date.now() - start) / 9000));
        shown += (target - shown) * (closing ? 0.4 : 0.14); // once the game is ready, finish quickly
        if (target - shown < 0.002) shown = target;
        paint(shown);
        if (closing && shown >= 0.999 && !finished) {
          finished = true;
          moon.className += ' done';
          setTimeout(function () {
            root.className += ' out';
            setTimeout(function () { if (root.parentNode) root.parentNode.removeChild(root); }, 450);
          }, 450);
        }
        requestAnimationFrame(tick);
      }
      window.__setGameLoader = function (p) { if (!closing) target = Math.max(target, Math.min(0.97, p)); };
      // the game is ready: the loading screen finishes its fade, but from this moment it no longer takes taps
      window.__dismissGameLoader = function () { closing = true; target = 1; root.style.pointerEvents = 'none'; };
      requestAnimationFrame(tick);
    })();
  </script>
